<!-- CONTACTO -->
<section id="contacto">

    <div class="section-title">
        <h2>Contáctanos</h2>
        <p>
            Solicita información sobre repuestos, soporte técnico o integración del chatbot empresarial.
        </p>
    </div>

    <div class="contact-container">

        <div class="contact-info">

            <h3>Información de Contacto</h3>

            <div class="contact-item">
                <i class="fas fa-map-marker-alt"></i>
                <div>
                    <h4>Ubicación</h4>
                    <p>La Paz, Bolivia</p>
                </div>
            </div>

            <div class="contact-item">
                <i class="fas fa-phone"></i>
                <div>
                    <h4>Teléfono</h4>
                    <p>+591 72088844</p>
                </div>
            </div>

            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <div>
                    <h4>Email</h4>
                    <p>info@repuestosgutierrez.com</p>
                </div>
            </div>

            <div class="contact-item">
                <i class="fas fa-clock"></i>
                <div>
                    <h4>Horario</h4>
                    <p>Lunes a Sábado - Horario Comercial</p>
                </div>
            </div>

        </div>

        <div class="contact-form">

            <form>
                <input type="text" placeholder="Nombre completo" required>
                <input type="email" placeholder="Correo electrónico" required>
                <input type="text" placeholder="Asunto">
                <textarea rows="6" placeholder="Escriba su mensaje..."></textarea>
                <button type="submit">Enviar Mensaje</button>
            </form>

        </div>

    </div>

</section>
